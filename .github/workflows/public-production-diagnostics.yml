name: Read-only public production diagnostics
on:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  production-public-browser:
    if: contains(github.event.head_commit.message, '[run-public-diagnostics]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run read-only live browser checks
        run: node tests/public-production-diagnostics.cjs
