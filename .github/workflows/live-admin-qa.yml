name: Temporary live admin QA
on:
  workflow_dispatch:
  push:
    branches: [arena/05594f6a-nextgen-laptops]
permissions:
  contents: read
jobs:
  live-admin:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-live-admin-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test the live admin with a dedicated account
        id: production
        continue-on-error: true
        env:
          QA_EMAIL: ${{ secrets.NEXTGEN_QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.NEXTGEN_QA_PASSWORD }}
        run: node tests/live-admin-qa.cjs
      - name: Build the current branch for isolated browser tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://sqdxnxcxajcgjvmcsksp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_N3z5B9NpOOFVzHDzzZKJgQ_PgBCZwXt
        run: npm run build
      - name: Test the branch using the real database and a temporary account
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://sqdxnxcxajcgjvmcsksp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_N3z5B9NpOOFVzHDzzZKJgQ_PgBCZwXt
          QA_LOCAL: '1'
          QA_EMAIL: ${{ secrets.NEXTGEN_QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.NEXTGEN_QA_PASSWORD }}
        run: |
          npm run start > /tmp/nextgen-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/admin/login >/dev/null && break; sleep 1; done
          node tests/live-admin-qa.cjs
      - name: Report production failure
        if: steps.production.outcome == 'failure'
        run: exit 1
